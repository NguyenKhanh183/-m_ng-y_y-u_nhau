<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đếm Ngày Yêu Nhau</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #4a4a4a;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px 20px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: #e84393;
            margin-bottom: 20px;
        }
        .avatars {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .avatar-box {
            text-align: center;
        }
        .avatar-box img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff7675;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .avatar-box input {
            border: none;
            background: transparent;
            text-align: center;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: #2d3436;
            width: 110px;
            margin-top: 8px;
            outline: none;
            border-bottom: 2px dashed #ff7675;
        }
        .heart-icon {
            font-size: 2rem;
            color: #d63031;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .counter-box {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(232, 67, 147, 0.15);
        }
        .days-count {
            font-size: 3.5rem;
            font-weight: 700;
            color: #e84393;
            line-height: 1;
        }
        .days-label {
            font-size: 1.1rem;
            color: #636e72;
            margin-top: 5px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .time-detail {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ffeaa7;
        }
        .time-unit span {
            display: block;
            font-size: 1.3rem;
            font-weight: 700;
            color: #d63031;
        }
        .time-unit label {
            font-size: 0.85rem;
            color: #b2bec3;
        }
        .date-picker-box {
            margin-top: 15px;
        }
        .date-picker-box label {
            font-size: 0.9rem;
            color: #636e72;
            display: block;
            margin-bottom: 5px;
        }
        .date-picker-box input {
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid #ff7675;
            outline: none;
            font-family: inherit;
            color: #e84393;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
        }
        .bg-heart {
            position: absolute;
            color: rgba(255, 118, 117, 0.5);
            animation: floatUp linear infinite;
            z-index: 1;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Đếm Ngày Yêu Nhau</h1>

        <div class="avatars">
            <div class="avatar-box">
                <img src="<img src="nam.jpg.jpg" alt="Nam">0" alt="Nam">
                <input type="text" id="name1" value="Anh" onchange="saveData()">
            </div>
            <div class="heart-icon">❤️</div>
            <div class="avatar-box">
                <img src="<img src="nu.jpg.jpg" alt="Nữ">" alt="Nữ">
                <input type="text" id="name2" value="Em" onchange="saveData()">
            </div>
        </div>

        <div class="counter-box">
            <div class="days-count" id="daysCount">0</div>
            <div class="days-label">NGÀY BÊN NHAU</div>

            <div class="time-detail">
                <div class="time-unit">
                    <span id="hours">00</span>
                    <label>Giờ</label>
                </div>
                <div class="time-unit">
                    <span id="minutes">00</span>
                    <label>Phút</label>
                </div>
                <div class="time-unit">
                    <span id="seconds">00</span>
                    <label>Giây</label>
                </div>
            </div>
        </div>

        <div class="date-picker-box">
            <label for="startDate">Chọn ngày bắt đầu yêu:</label>
            <input type="date" id="startDate" onchange="updateStartDate()">
        </div>
    </div>

    <script>
        // Lấy ngày đã lưu hoặc mặc định 1 năm trước
        let savedDate = localStorage.getItem('loveStartDate');
        if (!savedDate) {
            let defaultDate = new Date();
            defaultDate.setFullYear(defaultDate.getFullYear() - 1);
            savedDate = defaultDate.toISOString().split('T')[0];
            localStorage.setItem('loveStartDate', savedDate);
        }
        document.getElementById('startDate').value = savedDate;

        // Lấy tên đã lưu
        if (localStorage.getItem('name1')) document.getElementById('name1').value = localStorage.getItem('name1');
        if (localStorage.getItem('name2')) document.getElementById('name2').value = localStorage.getItem('name2');

        function saveData() {
            localStorage.setItem('name1', document.getElementById('name1').value);
            localStorage.setItem('name2', document.getElementById('name2').value);
        }

        function updateStartDate() {
            const newDate = document.getElementById('startDate').value;
            if (newDate) {
                localStorage.setItem('loveStartDate', newDate);
                calculateTime();
            }
        }

        function calculateTime() {
            const startDateVal = document.getElementById('startDate').value;
            if (!startDateVal) return;

            const start = new Date(startDateVal + "T00:00:00");
            const now = new Date();

            const diffTime = Math.abs(now - start);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diffTime / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diffTime / 1000 / 60) % 60);
            const seconds = Math.floor((diffTime / 1000) % 60);

            document.getElementById('daysCount').innerText = diffDays;
            document.getElementById('hours').innerText = hours < 10 ? '0' + hours : hours;
            document.getElementById('minutes').innerText = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('seconds').innerText = seconds < 10 ? '0' + seconds : seconds;
        }

        // Tạo hiệu ứng trái tim bay
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(calculateTime, 1000);
        setInterval(createHeart, 400);
        calculateTime();
    </script>
</body>
</html>
